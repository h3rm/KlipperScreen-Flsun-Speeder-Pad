name: Sync official KlipperScreen tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch official KlipperScreen
        run: |
          git remote add official https://github.com/KlipperScreen/KlipperScreen.git
          git fetch official master

      - name: Update official-tracker
        run: |
          git checkout -B official-tracker official/master
          git push origin official-tracker --force
